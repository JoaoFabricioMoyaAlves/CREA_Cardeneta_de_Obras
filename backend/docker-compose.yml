name: caderneta-obras

services:
  postgres:
    image: postgres:17-alpine
    container_name: caderneta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_obras
      POSTGRES_USER: caderneta_app
      POSTGRES_PASSWORD: dev_local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderneta_app -d gestao_obras"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: caderneta-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: caderneta_minio
      MINIO_ROOT_PASSWORD: dev_local_only_change_me
    ports:
      - "9000:9000" # API S3-compatible
      - "9001:9001" # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
