name: crea

services:
  postgres:
    image: postgres:17-alpine
    container_name: crea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_obras
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d gestao_obras"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: crea_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crea_api
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=gestao_obras;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: "CadernetaObras.Api"
      Jwt__Audience: "CadernetaObras.Frontend"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpiracaoMinutos: "480"
      Minio__Endpoint: ${MINIO_PUBLIC_ENDPOINT}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__BucketName: "caderneta-obras"
      Minio__UseSsl: "true"
      SegurancaAdmin__SenhaSecretaDev: ${ADMIN_DEV_SECRET}
      Tsa__Url: "http://timestamp.digicert.com"
      Tsa__TimeoutSegundos: "8"
      Bootstrap__AdminCpf: ${BOOTSTRAP_ADMIN_CPF}
      Bootstrap__AdminSenha: ${BOOTSTRAP_ADMIN_SENHA}
      Bootstrap__AdminNome: ${BOOTSTRAP_ADMIN_NOME}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL}
      Bootstrap__AdminTelefone: ${BOOTSTRAP_ADMIN_TELEFONE}
      Cors__FrontendOrigins__0: "https://crea.joaofabricio.com"
    ports:
      - "127.0.0.1:5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
